<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Links extension settings</title>
<link rel="stylesheet" href="popup.css">
<style>
  body { width: auto; min-width: 360px; padding: 20px; }
  form { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
  <form id="options">
    <div class="field">
      <label for="app-url">Links app URL</label>
      <input id="app-url" type="url" required placeholder="http://localhost:3000">
      <span class="hint">Where your Links app runs. Use the local dev server while developing, your deployed URL after.</span>
    </div>
    <p id="status" class="muted small" role="status"></p>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
